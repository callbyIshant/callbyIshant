<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .title { font-family: 'Courier New', Courier, monospace; font-size: 26px; font-weight: bold; fill: #00F0FF; }
    .subtitle { font-family: 'Courier New', Courier, monospace; font-size: 16px; fill: #8b949e; }
    .prompt { fill: #FF003C; }
    .node { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 6; }
    .node-txt { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #c9d1d9; font-weight: bold; }
    
    .flow-magenta { fill: none; stroke: #FF003C; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1s linear infinite; }
    .flow-blue { fill: none; stroke: #00F0FF; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -12; } }

    /* Typewriter effect */
    .typewriter {
        clip-path: inset(0 100% 0 0);
        animation: type 1.5s steps(20, end) forwards;
    }
    .typewriter-2 {
        clip-path: inset(0 100% 0 0);
        animation: type 1s steps(20, end) forwards;
        animation-delay: 1.5s;
    }
    .typewriter-3 {
        clip-path: inset(0 100% 0 0);
        animation: type 2s steps(40, end) forwards;
        animation-delay: 2.5s;
    }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Delayed fade-in for pipeline */
    .fade-in { opacity: 0; animation: fadeIn 1s forwards; animation-delay: 4.5s; }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>

  <rect width="100%" height="100%" class="bg" rx="10" />

  <!-- Terminal header buttons -->
  <circle cx="25" cy="25" r="6" fill="#ff5f56" />
  <circle cx="45" cy="25" r="6" fill="#ffbd2e" />
  <circle cx="65" cy="25" r="6" fill="#27c93f" />

  <!-- Text elements -->
  <g transform="translate(30, 80)">
    <text class="title typewriter"><tspan class="prompt">~/$</tspan> whoami</text>
    <text class="title typewriter-2" y="40"><tspan class="prompt">></tspan> Ishant Rustagi<tspan class="cursor">_</tspan></text>
    <text class="subtitle typewriter-3" y="75">Data Engineer | Pipeline Builder | ETL Enthusiast</text>
  </g>

  <!-- Pipeline Graphic -->
  <g transform="translate(30, 170)" class="fade-in">
    <!-- Flow Lines -->
    <path d="M 120 20 L 320 20" class="flow-magenta" />
    <path d="M 440 20 L 640 20" class="flow-blue" />

    <!-- Moving Packets -->
    <circle r="4" fill="#FF003C">
      <animateMotion dur="2s" repeatCount="indefinite" path="M 120 20 L 320 20" />
    </circle>
    <circle r="4" fill="#00F0FF">
      <animateMotion dur="2s" repeatCount="indefinite" path="M 440 20 L 640 20" />
    </circle>

    <!-- Nodes -->
    <rect x="0" y="0" width="120" height="40" class="node" />
    <text x="12" y="24" class="node-txt">Extract(Raw)</text>

    <rect x="320" y="0" width="120" height="40" class="node" />
    <text x="340" y="24" class="node-txt">Transform</text>

    <rect x="640" y="0" width="120" height="40" class="node" />
    <text x="652" y="24" class="node-txt">Load(Lake)</text>
  </g>
</svg>
